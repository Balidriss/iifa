[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iifa"
version = "0.1.0a2"
description = "Rich long-term memory for your agent, delivered under a token budget you set - never more."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "iifa contributors" }]
keywords = ["agent", "memory", "llm", "sqlite", "sqlcipher", "context-budget"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "sqlcipher3-wheels>=0.5.5",
  "httpx>=0.27",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
exact-tokens = ["tiktoken>=0.7"]
vectors = ["numpy>=1.26"]
# the OpenAI Agents SDK example (adapters/openai-agents), never the core
openai-agents = ["openai-agents>=0.24,<1"]
dev = [
  "pytest>=8.2",
  "pytest-xdist>=3.6",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "numpy>=1.26",
]

[project.scripts]
iifa = "iifa.__main__:main"

[project.urls]
Homepage = "https://github.com/Balidriss/iifa"

[tool.hatch.build.targets.wheel]
packages = ["src/iifa"]

[tool.hatch.build.targets.sdist]
include = ["src/iifa", "README.md", "docs", "LICENSE", "DEPENDENCIES.md", "CHANGELOG.md", "SPEC.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench", "adapters", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "T20"]
ignore = [
  "PLR0913",  # many arguments on public constructors is fine
  "PLR2004",  # magic values in tests and BM25 constants
  "PLR0917",  # FastAPI route signatures and small engines take several arguments
  "N818",     # NotFound, ScopeMismatch: spec vocabulary, not "Error" suffixes
  "S101",     # asserts are the test language
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"src/iifa/__main__.py" = ["T201", "PLC0415"]
"src/iifa/tokens.py" = ["PLC0415"]
"src/iifa/ingest/values.py" = ["RUF001"]  # transliteration tables: letters of every script
"tests/**" = ["S", "PLR", "T20", "N802", "E501", "RUF001"]
"bench/**" = ["T20", "S", "PLR", "E501", "RUF001"]  # multilingual corpora on purpose
"adapters/**" = ["T20", "S", "PLR"]   # standalone hook scripts: they print JSON and call urllib
"examples/**" = ["T20", "PLR"]        # the reference loop prints to the terminal

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sqlcipher3", "sqlcipher3.dbapi2", "tiktoken"]
ignore_missing_imports = true

# numpy (optional extra) ships stubs in Python 3.12 syntax, which a 3.11 target
# cannot parse; iifa.vectors uses it behind a typed interface only.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "security: proves an item of SPEC section 12 or a principle of section 2",
  "perf: latency or throughput threshold checked in CI at small scale",
  "exact_tokenizer: needs an exact tokenizer (tiktoken with a warm cache); skipped otherwise",
]
filterwarnings = [
  "error::DeprecationWarning:iifa.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true
source = ["iifa"]
omit = ["src/iifa/__main__.py", "src/iifa/mcp/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
